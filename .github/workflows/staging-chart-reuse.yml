name: Review exact baseline chart reuse
on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Existing cold-start session with a zero-diff proposal receipt
        required: true
        type: string
      execution_version:
        description: Exact immutable S3 execution VersionId
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: staging-chart-selection
  cancel-in-progress: false
env:
  CONTROL_BUCKET: ${{ vars.TECHX_STATE_BUCKET }}
  SESSION_ID: ${{ inputs.session_id }}
  EXECUTION_VERSION: ${{ inputs.execution_version }}
jobs:
  preview:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.LIFECYCLE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging-chart-read
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      request: ${{ steps.preview.outputs.request }}
      sha256: ${{ steps.preview.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install reviewed SDK dependencies
        run: python -m pip install -r scripts/requirements-automation.txt
      - name: Configure read-only reuse preview identity
        uses: aws-actions/configure-aws-credentials@ce2ec50a23cfb8aacf5544bea7a651d803d626f6
        with:
          role-to-assume: ${{ vars.AWS_CHART_READER_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '058114477594'
          role-session-name: techx-chart-read-${{ github.run_id }}
          role-duration-seconds: 1800
      - name: Show exact session, chart, digests and deadline without publishing
        id: preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/reuse_bootstrap_chart.py preview --bucket="$CONTROL_BUCKET" --session-id="$SESSION_ID" --execution-version="$EXECUTION_VERSION"
  approve:
    needs: preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging-chart-reuse
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install reviewed SDK dependencies
        run: python -m pip install -r scripts/requirements-automation.txt
      - name: Configure protected selector identity after human review
        uses: aws-actions/configure-aws-credentials@ce2ec50a23cfb8aacf5544bea7a651d803d626f6
        with:
          role-to-assume: ${{ vars.AWS_CHART_SELECTOR_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '058114477594'
          role-session-name: techx-chart-reuse-${{ github.run_id }}
          role-duration-seconds: 1800
      - name: Revalidate reviewed preview and publish immutable selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REUSE_REQUEST_JSON: ${{ needs.preview.outputs.request }}
          REUSE_REQUEST_SHA256: ${{ needs.preview.outputs.sha256 }}
        run: |
          python scripts/reuse_bootstrap_chart.py approve --bucket="$CONTROL_BUCKET" --session-id="$SESSION_ID" --execution-version="$EXECUTION_VERSION"
