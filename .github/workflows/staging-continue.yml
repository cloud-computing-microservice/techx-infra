name: Continue admitted staging lifecycle
on:
  workflow_dispatch:
    inputs:
      session_id:
        description: Existing admitted staging session (does not create a new environment)
        required: true
        type: string
      execution_version:
        description: Immutable S3 execution VersionId
        required: true
        type: string
      resume_approved:
        description: Resume the current saved plan after separate protected review
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: staging-lifecycle-continuation
  cancel-in-progress: false
jobs:
  continue:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && vars.LIFECYCLE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: staging-lifecycle
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SESSION_ID: ${{ inputs.session_id }}
      EXECUTION_VERSION: ${{ inputs.execution_version }}
      RESUME_APPROVED: ${{ inputs.resume_approved }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate typed existing-session inputs
        run: |
          python - <<'PY'
          import os, re
          assert re.fullmatch(r'staging-[A-Za-z0-9-]{1,64}', os.environ['SESSION_ID'])
          assert re.fullmatch(r'[A-Za-z0-9_./+=-]{1,1024}', os.environ['EXECUTION_VERSION'])
          assert os.environ['RESUME_APPROVED'] in ('true', 'false')
          PY
      - name: Install pinned SDK dependencies
        run: python -m pip install -r scripts/requirements-automation.txt
      - name: Configure scoped lifecycle dispatcher
        uses: aws-actions/configure-aws-credentials@ce2ec50a23cfb8aacf5544bea7a651d803d626f6
        with:
          role-to-assume: ${{ vars.AWS_LIFECYCLE_DISPATCHER_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '058114477594'
          role-session-name: techx-lifecycle-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Continue verified checkpoint and observe same build
        env:
          CONTROL_BUCKET: ${{ vars.TECHX_STATE_BUCKET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--bucket "$CONTROL_BUCKET" --session-id "$SESSION_ID" --execution-version "$EXECUTION_VERSION")
          if [ "$RESUME_APPROVED" = 'true' ]; then args+=(--resume-approved); fi
          python scripts/continue_lifecycle.py "${args[@]}"
